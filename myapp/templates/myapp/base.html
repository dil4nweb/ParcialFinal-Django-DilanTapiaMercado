<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de Programas</title>
<style>body{margin:0;background:#f1f5f9;color:#1e293b;font:16px Arial,sans-serif}header{background:#17365d;color:white;text-align:center;padding:30px 12px}header h1{margin:0 0 8px}.contenedor{max-width:620px;margin:35px auto;padding:30px;background:white;border-radius:12px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:bold;margin:18px 0 7px}input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #94a3b8;border-radius:6px}button{background:#17365d;color:white;border:0;border-radius:6px;padding:13px 22px;cursor:pointer;margin-top:20px}button:hover{background:#28588b}.mensaje{padding:12px;background:#dcfce7;color:#166534;border-radius:6px}.errorlist{color:#b91c1c}footer{text-align:center;padding:20px;color:#64748b}@media(max-width:700px){.contenedor{margin:15px;padding:20px}}</style></head>
<body><header><h1>Sistema de Gestión de Programas</h1><div>Parcial Final - Django</div></header><main class="contenedor">{% block contenido %}{% endblock %}</main><footer>Desarrollado por Dilan Tapia Mercado</footer></body></html>
